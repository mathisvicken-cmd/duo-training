<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Training</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duo">
<meta name="theme-color" content="#edf0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout : appli iPhone une colonne (max 560px). Une seule famille, Archivo, dont on joue sur la largeur :
   étendue pour les titres et les lettres de séance, condensée pour le chrono, normale pour le texte.
   Couleur de profil (cobalt / rose) pour l'effort, bleu eau pour les pauses. */
:root{
  --bg:#edf0ec; --card:#ffffff; --soft:#f3f5f2; --ink:#1a1f1c; --muted:#5d6761; --line:#d8ded7;
  --stage:#e2e7e1; --mat:#cbd5cc; --mat-edge:#b0bdb3; --grid:rgba(26,31,28,.06); --shadow:rgba(26,40,32,.16);
  --water:#1b8fac; --prep:#ad7609; --danger:#c23b3b; --on:#ffffff;
  --prop:#a88c68; --prop-top:#c8ae8a; --prop-edge:#6e5a41; --outline:#18201b;
  --acc:#2f5bea; --acc-soft:#e3e9fd; --acc-ink:#ffffff;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
.app[data-p="leane"]{--acc:#d9466f; --acc-soft:#fce3ea}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --card:#191d1b; --soft:#1f2421; --ink:#e7ece8; --muted:#97a29b; --line:#2a312d;
    --stage:#1a1f1c; --mat:#28322c; --mat-edge:#36423a; --grid:rgba(231,236,232,.05); --shadow:rgba(0,0,0,.45);
    --water:#4cc3de; --prep:#edb443; --danger:#ff6b6b; --on:#111412;
    --prop:#7a6650; --prop-top:#98806a; --prop-edge:#4d4032; --outline:#060907;
    --acc:#7695ff; --acc-soft:#1d2746; --acc-ink:#111412; color-scheme:dark}
  :root:not([data-theme="light"]) .app[data-p="leane"]{--acc:#ff779c; --acc-soft:#3a1d27}
}
:root[data-theme="dark"]{
  --bg:#111412; --card:#191d1b; --soft:#1f2421; --ink:#e7ece8; --muted:#97a29b; --line:#2a312d;
  --stage:#1a1f1c; --mat:#28322c; --mat-edge:#36423a; --grid:rgba(231,236,232,.05); --shadow:rgba(0,0,0,.45);
  --water:#4cc3de; --prep:#edb443; --danger:#ff6b6b; --on:#111412;
  --prop:#7a6650; --prop-top:#98806a; --prop-edge:#4d4032; --outline:#060907;
  --acc:#7695ff; --acc-soft:#1d2746; --acc-ink:#111412; color-scheme:dark}
:root[data-theme="dark"] .app[data-p="leane"]{--acc:#ff779c; --acc-soft:#3a1d27}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.42;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
p{margin:0}
.wide{font-stretch:125%}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authin{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.brand.big{font-size:34px}
#view{display:flex;flex-direction:column;gap:12px}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:800 21px/1 var(--f);font-stretch:125%;letter-spacing:-.01em;white-space:nowrap}
.who{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.who button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.who button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}

h2{font:800 25px/1.05 var(--f);font-stretch:125%;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font:700 16px/1.2 var(--f);margin:0}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{font-size:13px;color:var(--muted);line-height:1.4}

/* compteur de la semaine */
.count{display:flex;align-items:center;gap:14px}
.count b{font:800 52px/.85 var(--f);font-stretch:75%;color:var(--acc);font-variant-numeric:tabular-nums}
.count div{display:flex;flex-direction:column;gap:2px}
.count strong{font-weight:700;font-size:16px}

/* choix de la séance */
.pick{display:grid;gap:8px}
.ses{position:relative;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.ses b{font:900 34px/.9 var(--f);font-stretch:125%}
.ses span{font-size:12.5px;font-weight:600;line-height:1.15;min-height:2.3em}
.ses small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ses[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ses[aria-pressed="true"] small{color:inherit;opacity:.8}
.ses .ok{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center}
.ses[aria-pressed="true"] .ok{background:var(--acc-ink)}
.ok svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* détail */
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fact{background:var(--soft);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact b{font:700 18px/1.1 var(--f);font-variant-numeric:tabular-nums;white-space:nowrap}
.fact span{font-size:11.5px;color:var(--muted)}
.coachnote{border-left:3px solid var(--acc);padding:2px 0 2px 12px;font-size:14px;line-height:1.45}
.setrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.set{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;min-width:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.part{display:flex;flex-direction:column}
.parth{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0}
.parth span{font-size:13px;color:var(--muted)}
.ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;background:var(--card);position:relative}
.ex .n{flex:1;min-width:0}
.ex .n small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ex .idx{width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:700 12px/1 var(--f);flex:none}
.grip{width:44px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;border-radius:10px}
.grip svg{width:18px;height:18px;fill:currentColor}
.ex.drag{z-index:3;box-shadow:0 10px 26px var(--shadow);border-radius:12px;border-top-color:transparent;padding-inline:8px;margin-inline:-8px}
.ex.shift{transition:transform .15s ease}
.link{border:0;background:none;color:var(--acc);font-weight:600;padding:8px 0 0;font-size:13.5px;align-self:flex-start}
.start{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5}
.btn{border:0;border-radius:999px;padding:13px 18px;font:700 16px/1 var(--f);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%;padding:17px}
.start .btn{box-shadow:0 10px 26px var(--shadow)}

/* suivi */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{background:var(--soft);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:800 24px/1 var(--f);font-stretch:75%;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{font-size:11.5px;color:var(--muted);line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip2{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip2[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.delta{font-size:14px}
.delta b{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);text-align:right;padding:6px 4px;font-size:12px;white-space:nowrap}
td{text-align:right;padding:8px 4px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.now td{font-weight:700}
.prog{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:5px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span{min-width:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select{display:block;width:100%;min-width:0;max-width:100%;height:46px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:0 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input[type="date"]{line-height:46px;text-align:left}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.full{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.h{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.h .n{flex:1;min-width:0}
.h .n small{display:block;color:var(--muted);font-size:12.5px}
.h .k{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;flex:none}
.empty{font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px}
.confirm{display:flex;gap:6px;flex:none}
.confirm button{border:0;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600}

/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--acc)}

/* mode séance */
.run{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;--state:var(--prep);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.run[data-state="work"]{--state:var(--acc)}
.run[data-state="rest"],.run[data-state="done"]{--state:var(--water)}
.runin{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px;min-height:0}
.rtop{display:flex;align-items:center;gap:10px}
.rtop .t{flex:1;text-align:center;min-width:0}
.rtop .t b{display:block;font:700 15px/1.15 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .t span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px;fill:currentColor}
.stage{position:relative;flex:1;min-height:180px;background:var(--stage);border-radius:24px;overflow:hidden;touch-action:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:10px;left:10px;background:var(--card);font:600 12.5px/1 var(--f);padding:7px 11px 7px 9px;border-radius:999px;display:flex;align-items:center;gap:7px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--state)}
.kc{position:absolute;top:10px;right:10px;background:var(--card);font:600 12.5px/1 var(--f);padding:7px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.paused{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 13px/1 var(--f);padding:8px 14px;border-radius:999px}
.clock{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.timer{font:900 clamp(88px,28vw,156px)/.8 var(--f);font-stretch:62%;font-variant-numeric:tabular-nums;color:var(--state);letter-spacing:-.01em}
.what{flex:1;min-width:0;text-align:right;padding-bottom:3px}
.what .st{font:600 13px/1 var(--f);color:var(--state)}
.what h1{font:800 clamp(22px,6.4vw,32px)/1.02 var(--f);font-stretch:112%;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.cue{font-size:14px;color:var(--muted);line-height:1.38;min-height:2.76em}
.nextl{font-size:14px;color:var(--muted)}
.nextl b{color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--state)}
.barm{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl .icon{width:58px;height:58px}
.ctl .icon svg{width:24px;height:24px}
.playb{width:84px;height:84px;border-radius:50%;border:0;background:var(--state);color:var(--on);display:grid;place-items:center}
.playb svg{width:34px;height:34px;fill:currentColor}
.sheet{position:absolute;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet .panel{width:100%;max-width:520px}
.sheet .btns{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading">Chargement…</div>
<div class="auth" id="auth" hidden>
  <form class="authin" id="authForm">
    <div class="brand big">Duo Training</div>
    <p class="sub">Connecte-toi avec le même compte que Carnet Budget.</p>
    <label class="field">Email<input id="a-email" name="email" type="email" autocomplete="email" required></label>
    <label class="field">Mot de passe<input id="a-pass" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn acc block" id="authBtn" type="submit">Se connecter</button>
    <p class="note" id="authMsg"></p>
  </form>
</div>

<div class="app" id="app" data-p="mathis" hidden>
  <header class="top">
    <div class="brand">Duo Training</div>
    <div class="who" role="group" aria-label="Profil">
      <button id="p-mathis" data-who="mathis">Mathis</button>
      <button id="p-leane" data-who="leane">Léane</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="nav" aria-label="Navigation"><div>
    <button data-tab="seance" id="t-seance"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Séances</button>
    <button data-tab="suivi" id="t-suivi"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Suivi</button>
    <button data-tab="profil" id="t-profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
  </div></nav>

  <section class="run" id="run" hidden data-state="prep">
    <div class="runin">
      <div class="rtop">
        <button class="icon" id="r-stop" aria-label="Arrêter la séance"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
        <div class="t"><b id="r-title">Séance</b><span id="r-sub"></span></div>
        <button class="icon" id="r-restart" aria-label="Recommencer"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="Coach qui fait le mouvement en temps réel"></canvas>
        <div class="tag" id="r-phase">Échauffement</div>
        <div class="kc" id="r-kcal">0 kcal</div>
        <div class="paused" id="r-paused" hidden>En pause</div>
      </div>
      <div class="clock">
        <div class="timer" id="r-timer">0:10</div>
        <div class="what"><div class="st" id="r-state">Prêt</div><h1 id="r-name">Jumping jacks</h1></div>
      </div>
      <p class="cue" id="r-cue"></p>
      <p class="nextl" id="r-next"></p>
      <div class="bar"><i id="r-fill"></i></div>
      <div class="barm"><span id="r-el">0:00</span><span id="r-rem">0:00</span></div>
      <div class="ctl">
        <button class="icon" id="r-prev" aria-label="Exercice précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="playb" id="r-play" aria-label="Démarrer"><svg viewBox="0 0 24 24" id="r-picon"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="icon" id="r-nextb" aria-label="Exercice suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
    </div>
    <div class="sheet" id="sheet" hidden></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>

(() => {
/* ================= maths 3D ================= */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>mul(a,1/(len(a)||1)),
  lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
/* IK deux segments : position du coude / genou, plié vers "hint" */
function ik(a,c,l1,l2,hint){
  const d=sub(c,a); let L=len(d); const dn=L>1e-6?mul(d,1/L):[0,-1,0];
  L=Math.max(Math.abs(l1-l2)+1e-3,Math.min(l1+l2-1e-3,L));
  const x=(l1*l1-l2*l2+L*L)/(2*L), h=Math.sqrt(Math.max(0,l1*l1-x*x));
  let pp=sub(hint,mul(dn,dot(hint,dn)));
  if(len(pp)<1e-4) pp=cross(dn,Math.abs(dn[1])<.9?[0,1,0]:[1,0,0]);
  return add(add(a,mul(dn,x)),mul(norm(pp),h));
}

function mir(spec,ax){ // symétrie (axe 0 = x, 2 = z) + échange gauche/droite

}

  const hiL=sub(s.p,mul(lat,.1)), hiR=add(s.p,mul(lat,.1));
  const fl=v=>{if(v[1]<.03)v[1]=.03;return v;};
  const fwd=norm(cross(lat,sp));

    elL:fl(ik(shL,s.hl,.3,.28,s.el)), elR:fl(ik(shR,s.hr,.3,.28,s.er)),
    knL:fl(ik(hiL,s.fl,.46,.46,s.kl)), knR:fl(ik(hiR,s.fr,.46,.46,s.kr)), fwd, sp, lat, s};
  const toe=(kn,ft)=>{ // direction des orteils : vers l'avant du corps, perpendiculaire au tibia
    const sh=norm(sub(ft,kn)); let t=sub(fwd,mul(sh,dot(fwd,sh)));

}

function adjust(w,r,lvl){ // progression : plus de travail, moins de repos
  if(lvl==1) return [Math.max(20,w-10),r+10];
  if(lvl==3) return [w+5,Math.max(Math.min(r,10),r-5)];
  return [w,r];
}
function build(s,R,lvl,order){
  const B=[], W='Échauffement', K='Retour au calme';
  const circ=order.map(i=>s.circ[i]);
  B.push({type:'prep',ex:s.warm[0][0],dur:10,phase:W,ref:'w0'});
  s.warm.forEach(([e,d],i)=>{
    B.push({type:'work',ex:e,dur:d,phase:W,ref:'w'+i});
    if(i<s.warm.length-1) B.push({type:'rest',ex:s.warm[i+1][0],dur:10,phase:W,ref:'w'+(i+1)});
  });
  B.push({type:'rest',ex:circ[0][0],dur:30,phase:'Tour 1/'+R,ref:'c0',note:'Bois une gorgée'});
  for(let r=1;r<=R;r++){
    circ.forEach(([e,w0,r0],i)=>{
      const [w,rest]=adjust(w0,r0,lvl), ph='Tour '+r+'/'+R;
      B.push({type:'work',ex:e,dur:w,phase:ph,ref:'c'+i,idx:i+1,n:circ.length});
      if(i<circ.length-1) B.push({type:'rest',ex:circ[i+1][0],dur:rest,phase:ph,ref:'c'+(i+1)});
      else if(r<R) B.push({type:'rest',ex:circ[0][0],dur:s.rr,phase:'Tour '+(r+1)+'/'+R,ref:'c0',note:'Fin du tour '+r});
    });
  }
  B.push({type:'rest',ex:s.cool[0][0],dur:15,phase:K,ref:'k0',note:'Circuit terminé'});
  s.cool.forEach(([e,d],i)=>{
    B.push({type:'work',ex:e,dur:d,phase:K,ref:'k'+i});
    if(i<s.cool.length-1) B.push({type:'rest',ex:s.cool[i+1][0],dur:5,phase:K,ref:'k'+(i+1)});
  });
  return B;
}

function blockKcal(b,kg,sec){ // kcal = MET × kg × heures
  const met=b.type==='work'?EX[b.ex].met:(b.type==='prep'?1.5:2.5);

}

function barChart(weeks,unit){
  const W=340,H=150,pl=4,pb=22,max=Math.max(unit==='séances'?4:unit==='min'?60:200,...weeks.map(w=>w.v));
  const bw=(W-pl*2)/weeks.length;
  let g='';
  weeks.forEach((w,i)=>{
    const h=(H-pb-16)*w.v/max, x=pl+i*bw+bw*.16, y=H-pb-h, last=i===weeks.length-1, cx=(x+bw*.34).toFixed(1);
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="var(--acc)" opacity="${last?1:.42}"/>`;
    if(w.v>0) g+=`<text x="${cx}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="${last?700:500}" fill="var(--ink)">${nf(w.v)}</text>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${w.l}</text>`;
  });
  g+=`<line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Par semaine, en ${unit}">${g}</svg>`;
}
function lineChart(pts,target,unit){
  const W=340,H=170,pl=36,pr=12,pt=14,pb=24;
  const xs=pts.map(p=>parseIso(p.d).getTime()), ys=pts.map(p=>p.v).concat(target?[target]:[]);
  let y0=Math.min(...ys),y1=Math.max(...ys); const pad=Math.max(.5,(y1-y0)*.18); y0-=pad;y1+=pad;
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=t=>pl+(W-pl-pr)*(x1===x0?.5:(t-x0)/(x1-x0)), Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0));
  let g='';
  for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${pl-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${nf(v,y1-y0<6?1:0)}</text>`;}
  if(target){const y=Y(target);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--water)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${(y-5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--water)">objectif ${nf(target,1)} ${unit}</text>`;}
  if(pts.length>1){
    const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
    g+=`<path d="${path} L${X(xs[xs.length-1]).toFixed(1)} ${H-pb} L${X(xs[0]).toFixed(1)} ${H-pb}Z" fill="var(--acc)" opacity=".1"/>`;
    g+=`<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{const last=i===pts.length-1;g+=`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4.5:2.6}" fill="${last?'var(--acc)':'var(--card)'}" stroke="var(--acc)" stroke-width="1.6"/>`;});
  const L=pts.length-1;
  g+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${dm(pts[0].d)}</text>`;
  if(L>0) g+=`<text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--muted)">${dm(pts[L].d)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution dans le temps">${g}</svg>`;
}
function progressRow(label,v0,v,target,unit){
  if(!(target&&v0!=null&&v0!==target)) return `<div class="kv"><span>${label}</span><b>${nf(v,1)} ${unit}${target?', objectif '+nf(target,1):''}</b></div>`;
  const f=Math.max(0,Math.min(1,(v0-v)/(v0-target)));
  return `<div class="kv"><span>${label} : ${nf(v0,1)} → ${nf(v,1)} ${unit}</span><b>objectif ${nf(target,1)}</b></div><div class="prog" role="progressbar" aria-valuenow="${Math.round(f*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${(f*100).toFixed(0)}%"></i></div>`;
}

/* glisser pour réordonner le circuit */
$('view').addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]'); if(!g) return;
  e.preventDefault();
  const list=$('circ'), rows=[...list.querySelectorAll('.ex')], from=+g.dataset.grip, row=rows[from];
  const rects=rows.map(r=>r.getBoundingClientRect()), hgt=rects[from].height, y0=e.clientY;
  let to=from; DRAGGING=true; row.classList.add('drag');
  rows.forEach((r,i)=>{if(i!==from) r.classList.add('shift');});
  try{g.setPointerCapture(e.pointerId);}catch(_){}
  const move=ev=>{
    const dy=ev.clientY-y0; row.style.transform=`translateY(${dy}px)`;
    const c=rects[from].top+hgt/2+dy; to=from;
    rects.forEach((r,i)=>{const mid=r.top+r.height/2; if(i>from&&c>mid) to=Math.max(to,i); if(i<from&&c<mid) to=Math.min(to,i);});
    rows.forEach((r,i)=>{ if(i===from) return; let s=0; if(from<to&&i>from&&i<=to) s=-hgt; if(from>to&&i<from&&i>=to) s=hgt; r.style.transform=s?`translateY(${s}px)`:''; });
    if(ev.clientY<70) window.scrollBy(0,-8); else if(ev.clientY>window.innerHeight-150) window.scrollBy(0,8);
  };
  const up=()=>{
    g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
    DRAGGING=false;
    const sid=selSid(), o=orderOf(WHO,sid).slice();
    if(to!==from){const [it]=o.splice(from,1); o.splice(to,0,it); saveProf(WHO,{order:{...prof(WHO).order,[sid]:o}});}
    else render();
  };
  g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
});

function camera(W,H,az,el){
  az=az*Math.PI/180; el=el*Math.PI/180; const T=[0,.6,0], Dd=4.6;
  const pos=[Dd*Math.sin(az)*Math.cos(el),T[1]+Dd*Math.sin(el),Dd*Math.cos(az)*Math.cos(el)];

  for(const x of [-.8,.8])for(const z of [-1.25,1.2])for(const y of [0,2.05]){const q=p0(C,[x,y,z]);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
  const pad=.05; C.sc=Math.min(W*(1-2*pad)/(x1-x0),H*(1-2*pad)/(y1-y0));
  C.ox=W/2-C.sc*(x0+x1)/2; C.oy=H/2+C.sc*(y0+y1)/2;
  return C;
}
function p0(C,p){const d=sub(p,C.pos),z=dot(d,C.f);return [dot(d,C.r)/z,dot(d,C.u)/z,z];}
function P(C,p){const q=p0(C,p);return [C.ox+q[0]*C.sc,C.oy-q[1]*C.sc,q[2]];}
function poly(ctx,C,pts){ctx.beginPath();pts.forEach((p,i)=>{const q=P(C,p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();}

/* capsule effilée entre deux points 3D */
function capsule(ctx,C,a,b,ra,rb,grow){
  const A=P(C,a),B=P(C,b), RA=C.sc*ra/A[2]+grow, RB=C.sc*rb/B[2]+grow;
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);
  ctx.beginPath();
  if(L<Math.abs(RA-RB)+.5){const R=Math.max(RA,RB),c=RA>RB?A:B;ctx.arc(c[0],c[1],R,0,7);return;}
  const ang=Math.atan2(dy,dx), d=Math.acos(Math.max(-1,Math.min(1,(RA-RB)/L)));
  ctx.arc(A[0],A[1],RA,ang+d,ang-d+2*Math.PI);
  ctx.arc(B[0],B[1],RB,ang-d,ang+d);
  ctx.closePath();
}
function ball(ctx,C,c,r,grow){const Q=P(C,c);ctx.beginPath();ctx.arc(Q[0],Q[1],C.sc*r/Q[2]+grow,0,7);}

function drawChair(ctx,C,ch){
  const h=.46,{x0,x1,z0,z1}=ch, bz=ch.back<0?z0:z1;
  const items=[];
  const leg=(x,z)=>items.push({d:P(C,[x,h/2,z])[2],f:()=>{ctx.fillStyle=COL['prop-edge'];capsule(ctx,C,[x,0,z],[x,h,z],.018,.018,0);ctx.fill();}});
  leg(x0+.03,z0+.03);leg(x1-.03,z0+.03);leg(x0+.03,z1-.03);leg(x1-.03,z1-.03);
  items.push({d:P(C,[(x0+x1)/2,h,(z0+z1)/2])[2]-.001,f:()=>{
    const v=(x,y,z)=>[x,y,z], t=h-.045;
    const faces=[{pts:[v(x0,h,z0),v(x1,h,z0),v(x1,h,z1),v(x0,h,z1)],n:[0,1,0],c:COL['prop-top']},
      {pts:[v(x0,t,z1),v(x1,t,z1),v(x1,h,z1),v(x0,h,z1)],n:[0,0,1],c:COL.prop},{pts:[v(x0,t,z0),v(x1,t,z0),v(x1,h,z0),v(x0,h,z0)],n:[0,0,-1],c:COL.prop},
      {pts:[v(x1,t,z0),v(x1,t,z1),v(x1,h,z1),v(x1,h,z0)],n:[1,0,0],c:COL.prop},{pts:[v(x0,t,z0),v(x0,t,z1),v(x0,h,z1),v(x0,h,z0)],n:[-1,0,0],c:COL.prop}];
    ctx.lineJoin='round';ctx.lineWidth=Math.max(1,C.sc*.004);ctx.strokeStyle=COL['prop-edge'];
    for(const fc of faces){const cen=fc.pts.reduce((a,p)=>add(a,mul(p,.25)),[0,0,0]); if(dot(fc.n,sub(C.pos,cen))<=0) continue; poly(ctx,C,fc.pts);ctx.fillStyle=fc.c;ctx.fill();ctx.stroke();}
  }});
  items.push({d:P(C,[(x0+x1)/2,h+.25,bz])[2],f:()=>{
    ctx.fillStyle=COL['prop-edge'];
    capsule(ctx,C,[x0+.03,h,bz],[x0+.03,h+.44,bz],.016,.016,0);ctx.fill();
    capsule(ctx,C,[x1-.03,h,bz],[x1-.03,h+.44,bz],.016,.016,0);ctx.fill();
    poly(ctx,C,[[x0+.02,h+.24,bz],[x1-.02,h+.24,bz],[x1-.02,h+.44,bz],[x0+.02,h+.44,bz]]);ctx.fillStyle=COL.prop;ctx.fill();ctx.strokeStyle=COL['prop-edge'];ctx.stroke();
  }});
  items.sort((a,b)=>b.d-a.d).forEach(i=>i.f());
}

function drawCoach(ctx,C,k,who,px){
  const s=k.s, F=FIG[who], acc=hexOf(COL.acc||'#2563eb');
  const farL=P(C,k.shL)[2]>P(C,k.shR)[2];
  const col=(hex,far)=>far?shade(hex,.78):hex;
  const ol=Math.max(1.2,px*1.1);
  const groups=[];
  const G=(parts)=>{const pts=[];for(const p of parts){if(p.a){pts.push(p.a,p.b);}else pts.push(p.c);}
    groups.push({d:pts.reduce((a,p)=>a+P(C,p)[2],0)/pts.length,parts});};
  for(const side of ['L','R']){
    const far=(side==='L')===farL;
    const sh=k['sh'+side], el=k['el'+side], hd=s['h'+side.toLowerCase()], hi=k['hi'+side], kn=k['kn'+side], ft=s['f'+side.toLowerCase()], toe=k['toe'+side];
    const arm=[{a:sh,b:el,ra:.052,rb:.042,c0:col(F.skin,far)},{a:el,b:hd,ra:.041,rb:.032,c0:col(F.skin,far)},{c:hd,r:.043,c0:col(F.skin,far)}];
    if(F.sleeve) arm.splice(1,0,{a:sh,b:lerp(sh,el,.45),ra:.066,rb:.06,c0:col(acc,far)});
    if(side==='R'&&s.bottle!=null){ // gourde dans la main droite
      const upv=norm(sub(s.h,s.n)), mouth=add(add(s.h,mul(k.fwd,.09)),mul(upv,-.03));
      const ax=norm(lerp([0,1,0],norm(sub(mouth,hd)),s.bottle));
      arm.push({a:sub(hd,mul(ax,.06)),b:add(hd,mul(ax,.13)),ra:.038,rb:.036,c0:'#8fd8ea'},{a:add(hd,mul(ax,.13)),b:add(hd,mul(ax,.17)),ra:.022,rb:.02,c0:'#1d6f87'});
    }
    G(arm);
    const leg=[{a:hi,b:kn,ra:.078,rb:.056,c0:col(F.bottomFull?F.shorts:F.skin,far)},{a:kn,b:ft,ra:.055,rb:.04,c0:col(F.bottomFull?F.shorts:F.skin,far)},
      {a:ft,b:toe,ra:.048,rb:.04,c0:col(F.shoe,far)}];
    if(!F.bottomFull) leg.splice(1,0,{a:hi,b:lerp(hi,kn,.55),ra:.086,rb:.075,c0:col(F.shorts,far)});
    G(leg);
  }
  // torse : épaules, poitrine, ventre, bassin
  const chest=lerp(s.n,s.p,.3), waist=lerp(s.n,s.p,.68);
  G([{a:k.shL,b:k.shR,ra:.065,rb:.065,c0:acc},{a:chest,b:waist,ra:.13,rb:.115,c0:acc},
     {a:k.hiL,b:k.hiR,ra:.095,rb:.095,c0:F.shorts},{a:waist,b:s.p,ra:.11,rb:.105,c0:F.bottomFull?acc:F.shorts}]);
  const neckTop=lerp(s.n,s.h,.5);
  G([{a:s.n,b:neckTop,ra:.045,rb:.042,c0:F.skin}]);
  // tête
  const up=norm(sub(s.h,s.n)), fw=k.fwd;
  const facing=dot(fw,norm(sub(C.pos,s.h)))>-.15;
  const head={d:P(C,s.h)[2],head:true};
  groups.push(head);
  if(F.pony){
    const a=add(add(s.h,mul(fw,-.08)),mul(up,.07)), b=add(add(s.h,mul(fw,-.2)),mul(up,-.06));
    groups.push({d:(P(C,a)[2]+P(C,b)[2])/2+.0001,parts:[{a,b,ra:.04,rb:.026,c0:F.hair}]});
  }
  groups.sort((a,b)=>b.d-a.d);
  for(const g of groups){
    if(g.head){
      const hc=add(s.h,mul(up,.008));
      ctx.fillStyle=COL.outline; ball(ctx,C,hc,.112,ol); ctx.fill();
      ctx.fillStyle=F.hair; ball(ctx,C,hc,.112,0); ctx.fill();
      if(facing){ctx.fillStyle=F.skin; ball(ctx,C,add(add(s.h,mul(fw,.03)),mul(up,-.012)),.094,0); ctx.fill();}
      continue;
    }
    ctx.fillStyle=COL.outline;
    for(const p of g.parts){ if(p.a) capsule(ctx,C,p.a,p.b,p.ra,p.rb,ol); else ball(ctx,C,p.c,p.r,ol); ctx.fill(); }
    for(const p of g.parts){ ctx.fillStyle=p.c0; if(p.a) capsule(ctx,C,p.a,p.b,p.ra,p.rb,0); else ball(ctx,C,p.c,p.r,0); ctx.fill(); }
  }
}

function drawScene(ctx,W,H,exId,ph,who,cam,faded){
  const now=performance.now(); if(now-colAt>500){readCols();colAt=now;}
  ctx.clearRect(0,0,W,H); ctx.fillStyle=COL.stage; ctx.fillRect(0,0,W,H);
  const C=camera(W,H,cam.az,cam.el), px=W/400;
  // sol
  ctx.strokeStyle=COL.grid;ctx.lineWidth=Math.max(1,px);
  for(let g=-1.6;g<=1.61;g+=.4){
    ctx.beginPath();let a=P(C,[g,0,-1.6]),b=P(C,[g,0,1.6]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
    a=P(C,[-1.6,0,g]);b=P(C,[1.6,0,g]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
  poly(ctx,C,[[-.5,0,-1.2],[.5,0,-1.2],[.5,0,1.18],[-.5,0,1.18]]);
  ctx.fillStyle=COL.mat;ctx.fill();ctx.strokeStyle=COL['mat-edge'];ctx.lineWidth=Math.max(1,C.sc*.008);ctx.lineJoin='round';ctx.stroke();
  const ex=EX[exId]; if(!ex) return;
  if(ex.chair) drawChair(ctx,C,ex.chair);
  const k=skeleton(pose(ex,ph));
  // ombre au sol
  ctx.fillStyle=COL.shadow;
  const fl=p=>[p[0],.002,p[2]];
  for(const [a,b,r] of [[k.shL,k.elL,.05],[k.elL,k.s.hl,.04],[k.shR,k.elR,.05],[k.elR,k.s.hr,.04],[k.hiL,k.knL,.07],[k.knL,k.s.fl,.05],[k.hiR,k.knR,.07],[k.knR,k.s.fr,.05],[lerp(k.s.n,k.s.p,.3),k.s.p,.12],[k.s.n,k.s.h,.08]]){
    capsule(ctx,C,fl(a),fl(b),r,r,0);ctx.fill();
  }
  if(faded){
    if(!LAY||LAY.width!==W||LAY.height!==H){LAY=document.createElement('canvas');LAY.width=W;LAY.height=H;}
    const l=LAY.getContext('2d'); l.clearRect(0,0,W,H); drawCoach(l,C,k,who,px);
    ctx.globalAlpha=.5; ctx.drawImage(LAY,0,0); ctx.globalAlpha=1;
  } else drawCoach(ctx,C,k,who,px);
}
let LAY=null;

/* ================= mode séance ================= */
const R={who:'mathis',sid:'A',blocks:[],pre:[],tot:0,i:0,t:0,running:false,done:false,started:false,kg:70,saved:false};
let animT=0;
const CAM={az:38,el:24};
const isDrink=b=>b&&b.type==='rest'&&b.dur>=30;                 // pause recommandée : le coach boit
function startRun(sid){
  R.who=WHO;R.sid=sid;R.kg=kgOf(WHO);
  const p=prof(WHO); R.rounds=p.rounds; R.level=levelOf(WHO);
  R.blocks=blocksFor(WHO,sid); R.pre=[]; let a=0; for(const b of R.blocks){R.pre.push(a);a+=b.dur;} R.tot=a;
  R.planned=R.blocks.filter(b=>b.type==='work').length;
  resetRun();
  $('run').hidden=false; document.body.style.overflow='hidden';
  $('r-title').textContent='Séance '+sid+', '+PROG[WHO].sessions[sid].name;
  resize();
}
function resetRun(){R.i=0;R.t=0;R.running=false;R.done=false;R.started=false;R.saved=false;R.kcal=0;R.active=0;R.pause=0;R.skipped=[];R.doneEx=0;animT=0;$('sheet').hidden=true;unlock();}
function closeRun(){R.running=false;unlock();$('run').hidden=true;document.body.style.overflow='';render();}
function saveRun(partial){
  if(R.saved) return; R.saved=true;
  addItem('logs',{who:R.who,type:'seance',session:R.sid,date:iso(new Date()),ts:Date.now(),dur:Math.round(R.active),kcal:Math.round(R.kcal),
    rounds:R.rounds,level:R.level,partial:!!partial,pause:Math.round(R.pause),skipped:R.skipped.slice(),doneEx:R.doneEx,plannedEx:R.planned});
}
let WL=null;
async function lock(){try{if(navigator.wakeLock) WL=await navigator.wakeLock.request('screen');}catch(e){WL=null;}}
function unlock(){try{WL&&WL.release();}catch(e){} WL=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&R.running)lock();});
function finish(){R.done=true;R.running=false;R.t=R.blocks[R.i].dur;unlock();saveRun(false);showDone();}
function leaveBlock(manual){ // fin d'un bloc : compte l'exercice fait ou passé
  const b=R.blocks[R.i];
  if(b.type==='work'){ if(manual&&b.dur-R.t>3) R.skipped.push(b.ex); else R.doneEx++; }
}
function tick(dt){
  if(R.started&&!R.running&&!R.done) R.pause+=dt;            // temps passé en pause
  if(!R.running) return;
  const b=R.blocks[R.i]; R.t+=dt; R.active+=dt; R.kcal+=blockKcal(b,R.kg,dt);
  if(R.t>=b.dur){ leaveBlock(false); if(R.i<R.blocks.length-1){const over=R.t-b.dur;R.i++;R.t=over;animT=0;} else finish(); }
}
function sheet(html){$('sheet').innerHTML='<div class="panel">'+html+'</div>';$('sheet').hidden=false;}
function showDone(){
  sheet(`<h2>Séance ${R.sid} terminée</h2>
    <div class="tiles"><div class="tile"><b>${fmt(R.active)}</b><span>d’effort</span></div><div class="tile"><b>${Math.round(R.kcal)}</b><span>kcal estimées</span></div><div class="tile"><b>${mmss(R.pause)}</b><span>en pause</span></div></div>
    <p class="note">${R.doneEx} exercices sur ${R.planned}${R.skipped.length?', '+R.skipped.length+' passé'+(R.skipped.length>1?'s':''):''}. Séance enregistrée dans ton suivi.</p>
    <div class="btns"><button class="btn acc block" data-sh="close">Fermer</button></div>`);
}
function showStop(){
  const was=R.running; R.running=false; unlock();
  const canSave=R.active>120&&!R.saved;
  sheet(`<h2>Arrêter la séance ?</h2><p class="sub">${fmt(R.active)} d’effort, ${R.doneEx} exercices faits.</p>
    <div class="btns">
      ${canSave?`<button class="btn acc block" data-sh="save">Enregistrer et quitter</button>`:''}
      <button class="btn ghost block" data-sh="${was?'resume':'back'}">${was?'Reprendre':'Revenir à la séance'}</button>
      <button class="btn danger block" data-sh="quit">Quitter sans enregistrer</button>
    </div>`);
}
$('sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-sh]'); if(!b) return; const a=b.dataset.sh;
  if(a==='close'||a==='quit'){$('sheet').hidden=true;closeRun();}
  else if(a==='save'){saveRun(true);$('sheet').hidden=true;closeRun();toast('Séance enregistrée');}
  else if(a==='resume'){$('sheet').hidden=true;R.running=true;lock();}
  else if(a==='back'){$('sheet').hidden=true;}
});
$('r-stop').addEventListener('click',()=>{ if(R.done||!R.started){closeRun();return;} showStop(); });
$('r-restart').addEventListener('click',()=>{resetRun();});
$('r-play').addEventListener('click',()=>{
  if(R.done){resetRun();return;}
  R.running=!R.running; R.started=true;
  if(R.running) lock(); else unlock();
});
$('r-prev').addEventListener('click',()=>{ if(R.done) return; if(R.t>2||R.i===0){R.t=0;animT=0;} else {R.i--;R.t=0;animT=0;} });
$('r-nextb').addEventListener('click',()=>{ if(R.done) return; leaveBlock(true); if(R.i<R.blocks.length-1){R.i++;R.t=0;animT=0;} else finish(); });

const cv=$('cv'), stage=$('stage'); const ctx=cv.getContext('2d');
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
new ResizeObserver(resize).observe(stage);
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az:CAM.az,el:CAM.el};try{stage.setPointerCapture(e.pointerId);}catch(_){}});
stage.addEventListener('pointermove',e=>{if(!drag)return;CAM.az=drag.az-(e.clientX-drag.x)*.4;CAM.el=Math.max(6,Math.min(70,drag.el+(e.clientY-drag.y)*.25));});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,()=>{drag=null;}));
stage.addEventListener('dblclick',()=>{CAM.az=38;CAM.el=24;});

const cacheTxt={};
const setT=(id,v,prop='textContent')=>{if(cacheTxt[id+prop]!==v){cacheTxt[id+prop]=v;$(id)[prop]=v;}};
function runUi(){
  const b=R.blocks[R.i], ex=EX[b.ex], drink=isDrink(b);
  const st=R.done?'done':b.type==='work'?'work':b.type==='prep'?'prep':'rest';
  if($('run').dataset.state!==st) $('run').dataset.state=st;
  setT('r-timer',R.done?'0:00':fmt(b.dur-R.t));
  setT('r-state',R.done?'Terminé':b.type==='work'?(ex.hold?'Tiens la position':'Effort'):b.type==='prep'?'Prépare-toi':drink?'Pause eau, ensuite':'Repos, ensuite');
  setT('r-name',R.done?'Bravo':ex.name);
  setT('r-cue',R.done?'Séance enregistrée.':drink?(b.note&&b.note!=='Bois une gorgée'?b.note+'. ':'')+'Bois une gorgée d’eau et respire calmement.':ex.cue);
  let nx='';
  if(!R.done){
    if(b.type==='work'){const n=R.blocks.slice(R.i+1).find(x=>x.type==='work'); nx=n?'Ensuite : <b>'+EX[n.ex].name+'</b>':'Dernier exercice.';}
    else nx='Puis <b>'+(R.blocks[R.i+1]?R.blocks[R.i+1].dur:0)+' s</b> '+(ex.hold?'de maintien':'d’effort');
  }
  setT('r-next',nx,'innerHTML');
  setT('r-phase',R.done?'Terminé':drink?'Pause eau':b.phase+(b.idx&&b.type==='work'?', exercice '+b.idx+'/'+b.n:''));
  setT('r-kcal',Math.round(R.kcal)+' kcal');
  $('r-paused').hidden=!(R.started&&!R.running&&!R.done);
  const el=R.done?R.tot:R.pre[R.i]+R.t;
  $('r-fill').style.width=(100*el/R.tot)+'%';
  setT('r-el',fmt(el)+' écoulé'); setT('r-rem','reste '+fmt(R.tot-el));
  setT('r-sub',R.rounds+' tours, niveau '+R.level);
  setT('r-picon',R.running?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>','innerHTML');
  $('r-play').setAttribute('aria-label',R.running?'Pause':R.started?'Reprendre':'Démarrer');
}
let last=performance.now();
function frame(ts){
  const dt=Math.min(.1,Math.max(0,(ts-last)/1000)); last=ts;
  if(!$('run').hidden){
    tick(dt); if(R.running||R.done) animT+=dt;                        // le coach se fige quand tu mets en pause
    const b=R.blocks[R.i], drink=isDrink(b)||R.done, id=drink?'drink':b.ex, ex=EX[id];
    drawScene(ctx,cv.width,cv.height,id,((animT/ex.period)%1+1)%1,R.who,CAM,!drink&&b.type!=='work'&&!R.done);
    runUi();
  }
  requestAnimationFrame(frame);
}

/* ================= connexion et démarrage ================= */
function showShell(){$('loading').hidden=true;$('auth').hidden=true;$('app').hidden=false;render();}
function showAuth(msg){ME=null;$('loading').hidden=true;$('app').hidden=true;$('run').hidden=true;$('auth').hidden=false;$('authMsg').textContent=msg||'';}
async function onSession(user){
  ME=user; let who=null;
  try{
    const r=await SB.from('duo_members').select('who').eq('user_id',user.id).maybeSingle();
    if(r.error) throw r.error;
    who=r.data&&r.data.who;
    if(!who){await SB.auth.signOut();showAuth('Ce compte n’a pas accès à Duo Training.');return;}
    try{localStorage.setItem('duo-me',who);}catch(e){}
  }catch(e){ try{who=localStorage.getItem('duo-me');}catch(_){} if(!who){showAuth('Pas de réseau. Réessaie une fois connecté.');return;} }
  MYWHO=who; if(!UI_SAVED){WHO=who;UI_SAVED=true;saveUi();}
  showShell(); refresh();
}
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault(); if(!SB){$('authMsg').textContent='Pas de réseau. Réessaie une fois connecté.';return;}
  $('authBtn').disabled=true; $('authMsg').textContent='';
  const {error}=await SB.auth.signInWithPassword({email:$('a-email').value.trim(),password:$('a-pass').value});
  $('authBtn').disabled=false;
  if(error) $('authMsg').textContent=/Invalid login/i.test(error.message)?'Email ou mot de passe incorrect.':'Connexion impossible : '+error.message;
});
let known=null; try{known=localStorage.getItem('duo-me');}catch(e){}
if(known){ if(!UI_SAVED) WHO=known; showShell(); }  // affichage immédiat de la dernière copie
requestAnimationFrame(frame);
if(typeof supabase==='undefined'){ if(!known) $('loading').textContent='Pas de réseau. Réessaie une fois connecté.'; }
else{
  SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  SB.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null;
    if(u){ if(!ME||ME.id!==u.id) setTimeout(()=>onSession(u),0); }
    else { try{localStorage.removeItem('duo-me');}catch(e){} showAuth(); }
  });
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
